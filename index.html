    <script>
      // Suppress benign Vite HMR websocket connection errors in cloud sandbox
      (function() {
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var instance = protocols ? new OrigWS(url, protocols) : new OrigWS(url);
            instance.addEventListener('error', function(e) {
              if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
            });
            return instance;
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('error', function(event) {
        var msg = event && (event.message || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);

      // GitHub Pages SPA path restoration handler
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
